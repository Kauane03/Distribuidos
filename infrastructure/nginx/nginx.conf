events {
    worker_connections 1024;
}

http {
    # Agrupamento dos servidores backend para balanceamento de carga
    # O algoritmo padrão é o Round Robin, distribuindo as requisições sequencialmente
    upstream backend_cluster {
        server backend:3000;
    }

    # Mapeamento do cabeçalho Upgrade para suportar WebSockets e HTTP regular
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 3000;
        server_name localhost;

        # Configurações de log
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Rota para conexões WebSocket persistentes
        location /ws {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # Headers obrigatórios para handshake de WebSocket (RFC 6455)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;

            # Encaminhamento de IP real do cliente
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts estendidos para evitar desconexão prematura do socket
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Rota geral para APIs REST HTTP
        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Headers para evitar cache em respostas dinâmicas de telemetria
            proxy_set_header X-Nginx-Proxy "PetTracker-LoadBalancer";
        }
    }
}

