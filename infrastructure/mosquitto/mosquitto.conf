# Configuração do Eclipse Mosquitto para o Pet Tracker Distribuído
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket listener opcional no broker (porta 9001)
listener 9001 0.0.0.0
protocol websockets

# Persistência
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
